<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="brand">
        <div class="brand-icon">📦</div>
        <h1>SmartStock</h1>
        <p>Smart Inventory Management System</p>
    </div>

    <div class="login-card">
        <h2>Welcome Back 👋</h2>
        <p class="muted">Login to manage your inventory</p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter password" required>

            <button type="submit" class="primary-btn">
                Login
            </button>
        </form>

        <div class="demo-box">
            <strong>Demo Account</strong>
            <p>Email: admin@smartstock.com</p>
            <p>Password: admin123</p>
        </div>

        <p class="switch">
            Don't have an account?
            <a href="#" onclick="showSignup()">Sign Up</a>
        </p>

        <p class="switch">
            <a href="#" onclick="showReset()">Forgot Password?</a>
        </p>
    </div>
</div>

<!-- Signup Modal -->
<div class="modal" id="signupModal">
    <div class="modal-box">
        <span class="close" onclick="closeModal('signupModal')">×</span>
        <h2>Create Account</h2>

        <input type="text" id="signupName" placeholder="Full Name">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password">

        <select id="signupRole">
            <option>Inventory Manager</option>
            <option>Warehouse Staff</option>
        </select>

        <button class="primary-btn" onclick="signup()">
            Create Account
        </button>
    </div>
</div>

<!-- Reset Password Modal -->
<div class="modal" id="resetModal">
    <div class="modal-box">
        <span class="close" onclick="closeModal('resetModal')">×</span>
        <h2>Reset Password</h2>

        <input type="email" id="resetEmail"
               placeholder="Enter registered email">

        <button class="primary-btn" onclick="sendOTP()">
            Send OTP
        </button>

        <input type="text" id="otp"
               placeholder="Enter OTP">

        <input type="password" id="newPassword"
               placeholder="New Password">

        <button class="secondary-btn" onclick="resetPassword()">
            Reset Password
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
